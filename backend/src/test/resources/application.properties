# Valores exclusivos de la suite automatizada; nunca se usan en dev/prod.
spring.config.import=optional:configserver:
app.seed.enabled=false
spring.datasource.url=${POLICALUM_TEST_DB_URL:${POLICALUM_IT_DB_URL:jdbc:postgresql://127.0.0.1:5432/ERPpoli_it_unconfigured}}
spring.datasource.username=${POLICALUM_TEST_DB_USERNAME:${POLICALUM_IT_DB_USERNAME:postgres}}
spring.datasource.password=${POLICALUM_TEST_DB_PASSWORD:${POLICALUM_IT_DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver
jwt.secret=test-only-secret-with-at-least-32-characters
jwt.expiration=3600000
jwt.refresh-expiration=7200000
totp.secret-key-publico=test-only-totp-secret
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
