# Perfil local: no usar en producción.
#
# ddl-auto=validate (especificación 2026-11-06, §1): Hibernate no altera la estructura, solo
# la comprueba. Verificado el 2026-11-06: la aplicación arranca contra `ERPpoli` con validate
# después de aplicar backend/sql/20261106_rrhh_regimen_remuneracion.sql y
# backend/sql/20261106_servicio_colaborador_tipo.sql.
#
# Cualquier cambio de entidad exige ahora un script en backend/sql/ aplicado y revisado antes.
# Si necesita el viejo comportamiento automático de forma puntual:
#   -Dspring.jpa.hibernate.ddl-auto=update   (o la variable DDL_AUTO=update)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.password=${DB_PASSWORD:postgre}
jwt.secret=${JWT_SECRET:dev-only-change-this-jwt-secret-please-rotate}
totp.secret-key-publico=${TOTP_PUBLIC_SECRET:dev-only-totp-secret}
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
