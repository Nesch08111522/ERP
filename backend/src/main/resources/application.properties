
# =====================================================
# CONFIGURACIÓN GENERAL
# =====================================================
spring.application.name=ErpPolicalum

# Escuchar conexiones desde otros dispositivos de la red
server.address=0.0.0.0
server.port=8080

# =====================================================
# SPRING CLOUD CONFIG - DESACTIVADO EN LOCAL
# =====================================================
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# =====================================================
# DATABASE - POSTGRESQL
# =====================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ERPpoli}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgre}
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================
# HIBERNATE / JPA
# =====================================================
# validate: Hibernate comprueba la estructura contra las entidades y NO la modifica.
# Los cambios de esquema van en backend/sql/ como script idempotente, revisado antes de aplicar.
# Sobrescribible con DDL_AUTO=update para una exploración puntual.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =====================================================
# CORS - RED LOCAL
# =====================================================
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:4201,http://127.0.0.1:4201,http://192.168.100.11:4200,http://192.168.100.11:4201}

# =====================================================
# JWT - DESARROLLO LOCAL
# =====================================================
jwt.secret=${JWT_SECRET:dev-only-change-this-jwt-secret-please-rotate-32b}
jwt.expiration=${JWT_EXPIRATION:28800000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:1209600000}

# =====================================================
# TOTP - DESARROLLO LOCAL
# =====================================================
totp.secret-key-publico=${TOTP_PUBLIC_SECRET:dev-only-totp-secret-not-for-production}

# =====================================================
# ARCHIVOS
# =====================================================
app.uploads.base-path=${UPLOADS_BASE_PATH:./uploads}

# --- Rendimiento: batch de Hibernate para inserciones/actualizaciones por lotes ---
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# --- Rate limiting (Bucket4j) para endpoints publicos sin sesion ---
app.rate-limit.login.capacity=${RATE_LIMIT_LOGIN_CAPACITY:10}
app.rate-limit.login.window-seconds=${RATE_LIMIT_LOGIN_WINDOW:60}
app.rate-limit.qr-publico.capacity=${RATE_LIMIT_QR_CAPACITY:30}
app.rate-limit.qr-publico.window-seconds=${RATE_LIMIT_QR_WINDOW:60}
