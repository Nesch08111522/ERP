<div class="sidebar-backdrop" *ngIf="layout.mobileOpen()" (click)="layout.closeMobile()"></div>
<aside class="app-sidebar" aria-label="Navegación principal">
  <div class="sidebar-brand">
    <img class="brand-logo" [src]="marca.logoSrc()" [alt]="marca.nombre()" (error)="marca.usarRespaldo()" />
    <span class="brand-name"><strong>{{ marca.nombre() }}</strong><span class="text-xs">ERP</span></span>
  </div>
  <nav class="sidebar-scroll">
    <section *ngFor="let section of sections" class="nav-group">
      <button
        type="button"
        class="nav-section nav-section-btn"
        (click)="toggleGroup(section.id)"
        [title]="section.label"
        [attr.aria-expanded]="isOpen(section.id)">
        <span>{{ section.label }}</span>
        <app-icon [name]="isOpen(section.id) ? 'chevronDown' : 'chevron'"></app-icon>
      </button>
      <div class="nav-items" *ngIf="isOpen(section.id) || layout.collapsed()">
        <a
          *ngFor="let item of section.items"
          class="nav-link"
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.path === '/inicio' }"
          [title]="item.label"
          [attr.aria-label]="layout.collapsed() ? item.label : null"
          (click)="layout.closeMobile()">
          <app-icon [name]="item.icon"></app-icon>
          <span class="nav-label">{{ item.label }}</span>
          <span class="nav-aviso" *ngIf="item.id === 'mensajes-web' && bandeja.total() > 0">{{ bandeja.total() > 99 ? '99+' : bandeja.total() }}</span>
        </a>
      </div>
    </section>
  </nav>
</aside>
