<section class="module-page">
  <app-page-header title="Notificaciones" subtitle="Alertas de stock mínimo y crítico. Las pasadas siguen visibles y se borran de forma permanente a los 30 días."></app-page-header>
  <div class="filtros-avisos" role="group" aria-label="Filtrar notificaciones">
    <button type="button" [class.activo]="filtro === 'hoy'" (click)="filtro = 'hoy'">Hoy <span>{{ cantidadHoy }}</span></button>
    <button type="button" [class.activo]="filtro === 'todas'" (click)="filtro = 'todas'">Todas</button>
    <button type="button" [class.activo]="filtro === 'eliminadas'" (click)="filtro = 'eliminadas'">Eliminadas</button>
    <button type="button" [class.activo]="filtro === 'pasadas'" (click)="filtro = 'pasadas'">Pasadas</button>
    <button type="button" class="btn btn-danger btn-sm" (click)="archivarVisibles()" [disabled]="!cantidadVisiblesEliminables">Eliminar visibles ({{ cantidadVisiblesEliminables }})</button>
    <button type="button" class="accion" (click)="leerTodas()" [disabled]="!cantidadNoLeidas">Marcar no leídas como leídas</button>
  </div>
  <p *ngIf="cargando" class="text-muted">Cargando notificaciones…</p>
  <p *ngIf="!cargando && !visibles.length" class="text-muted">No hay notificaciones en esta vista.</p>
  <article class="aviso-card" *ngFor="let aviso of visibles" [class.pasada]="aviso.eliminada || aviso.leida">
    <div>
      <p class="tipo">{{ tipo(aviso) }} <span *ngIf="aviso.eliminada">· eliminada</span><span *ngIf="aviso.leida && !aviso.eliminada">· leída</span></p>
      <h2>{{ aviso.titulo }}</h2>
      <p>{{ aviso.detalle }}</p>
      <p class="fecha" *ngIf="aviso.createdAt">{{ aviso.createdAt | date:'dd/MM/yyyy HH:mm' }}</p>
    </div>
    <div class="cluster">
      <button type="button" class="btn btn-primary btn-sm" (click)="abrir(aviso)">Ir al problema</button>
      <button type="button" class="btn btn-ghost btn-sm" *ngIf="!aviso.leida" (click)="leida(aviso)">Marcar leída</button>
      <button type="button" class="btn btn-danger btn-sm" *ngIf="!aviso.eliminada" (click)="archivar(aviso)">Eliminar</button>
    </div>
  </article>
  <p class="text-sm text-muted">También puedes volver al <a routerLink="/inicio">panel</a>.</p>
</section>
